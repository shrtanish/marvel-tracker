# Fills data/posters.json from TMDB and commits it. Run it from the Actions tab ("Run workflow").
# Needs a repository secret named TMDB_API_KEY (Settings > Secrets and variables > Actions).
name: Update posters
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Look every poster up again"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch posters
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetch-posters.mjs ${{ inputs.refresh && '--refresh' || '' }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posters.json
          git diff --cached --quiet || (git commit -m "Update posters from TMDB" && git push)
